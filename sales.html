  <script>/* Fast Layer: IndexedDB cache + optimistic UI + optional Supabase REST */
(function (global) {
  var DB_NAME = "hlift-fast-layer";
  var DB_VERSION = 1;
  var STORE = "tickets";

  function cfg() {
    return global.__FAST_LAYER__ || {};
  }

  function enabled() {
    return !!(cfg().url && cfg().anon);
  }

  function projectName() {
    return String(cfg().project || "").trim();
  }

  function openDb() {
    return new Promise(function (resolve, reject) {
      if (!global.indexedDB) {
        resolve(null);
        return;
      }
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains(STORE)) {
          db.createObjectStore(STORE, { keyPath: "client_id" });
        }
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { resolve(null); };
    });
  }

  function idbPut(row) {
    return openDb().then(function (db) {
      if (!db) return row;
      return new Promise(function (resolve) {
        var tx = db.transaction(STORE, "readwrite");
        tx.objectStore(STORE).put(row);
        tx.oncomplete = function () { resolve(row); };
        tx.onerror = function () { resolve(row); };
      });
    });
  }

  function idbAll() {
    return openDb().then(function (db) {
      if (!db) return [];
      return new Promise(function (resolve) {
        var tx = db.transaction(STORE, "readonly");
        var req = tx.objectStore(STORE).getAll();
        req.onsuccess = function () { resolve(req.result || []); };
        req.onerror = function () { resolve([]); };
      });
    });
  }

  function rest(path, options) {
    var c = cfg();
    options = options || {};
    options.headers = Object.assign({
      apikey: c.anon,
      Authorization: "Bearer " + c.anon,
      "Content-Type": "application/json"
    }, options.headers || {});
    return fetch(c.url.replace(/\/$/, "") + path, options).then(function (res) {
      if (!res.ok) throw new Error("supabase " + res.status);
      if (res.status === 204) return null;
      return res.json();
    });
  }

  function toView(row) {
    return {
      subject: row.subject,
      detail: row.detail,
      status: row.status || "در حال بررسی",
      date: row.registered_on || row.date || "",
      reporter: row.sender || row.reporter || "",
      client_id: row.client_id
    };
  }

  function cachedList(reporter) {
    return idbAll().then(function (rows) {
      var mine = String(reporter || "").trim();
      var seeAll = ["مهندس مزروعی", "مدیر فروش", "داشبورد"].indexOf(mine) !== -1;
      return rows
        .filter(function (r) {
          if (projectName() && r.project_name && r.project_name !== projectName()) return false;
          if (!seeAll && mine && String(r.sender || "") !== mine) return false;
          return true;
        })
        .sort(function (a, b) { return String(b.created_at || "").localeCompare(String(a.created_at || "")); })
        .map(toView);
    });
  }

  function optimisticAdd(ticket) {
    var row = {
      client_id: ticket.client_id || ("local-" + Date.now() + "-" + Math.random().toString(16).slice(2)),
      project_name: projectName(),
      sender: ticket.reporter || ticket.sender || "",
      subject: ticket.subject,
      detail: ticket.detail,
      status: "در حال بررسی",
      registered_on: ticket.date || "",
      created_at: new Date().toISOString(),
      send_flag: true
    };
    return idbPut(row).then(function () { return row; });
  }

  function submitTicket(ticket) {
    return optimisticAdd(ticket).then(function (row) {
      if (!enabled()) return row;
      return rest("/rest/v1/tickets", {
        method: "POST",
        headers: { Prefer: "return=representation" },
        body: JSON.stringify({
          project_name: row.project_name,
          sender: row.sender,
          subject: row.subject,
          detail: row.detail,
          status: row.status,
          registered_on: row.registered_on,
          client_id: row.client_id,
          send_flag: true
        })
      }).then(function () { return row; });
    });
  }

  function pullTickets(reporter) {
    if (!enabled()) return cachedList(reporter);
    var qs = "?select=*&order=created_at.desc";
    if (projectName()) qs += "&project_name=eq." + encodeURIComponent(projectName());
    return rest("/rest/v1/tickets" + qs).then(function (rows) {
      rows = rows || [];
      var chain = Promise.resolve();
      rows.forEach(function (r) {
        if (!r.client_id) r.client_id = r.id;
        chain = chain.then(function () { return idbPut(r); });
      });
      return chain.then(function () { return cachedList(reporter); });
    }).catch(function () { return cachedList(reporter); });
  }

  /* ---- لیست قیمت: صف مدیر از آینهٔ Supabase (price_inbox_cards) ----
     قرارداد: اگر Supabase پیکربندی نشده، در دسترس نیست، فیلتر شده یا دیر جواب داد (timeout)،
     Promise رد می‌شود و صدازننده از مسیر قبلی (google.script.run + کش مرورگر) ادامه می‌دهد.
     بعد از هر شکست، تا ۱۰ دقیقه Supabase را نمی‌زنیم تا کاربر جریمهٔ timeout نخورد. */
  var DOWN_KEY = "fastLayerDownUntil";
  var DOWN_MS = 10 * 60 * 1000;

  function downUntil() {
    try { return Number(localStorage.getItem(DOWN_KEY) || 0); } catch (e) { return 0; }
  }
  function markDown() {
    try { localStorage.setItem(DOWN_KEY, String(Date.now() + DOWN_MS)); } catch (e) {}
  }
  function markUp() {
    try { localStorage.removeItem(DOWN_KEY); } catch (e) {}
  }

  function fetchWithTimeout(url, options, ms) {
    var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, ms) : null;
    if (ctrl) options.signal = ctrl.signal;
    return fetch(url, options).then(function (res) {
      if (timer) clearTimeout(timer);
      return res;
    }, function (err) {
      if (timer) clearTimeout(timer);
      throw err;
    });
  }

  // filterQs: "&in_inbox=eq.true" (صف مدیر) یا "&salesperson=eq.<نام>" (اپ بازاریاب)
  function pullCards(filterQs, timeoutMs) {
    if (!enabled()) return Promise.reject(new Error("fast layer off"));
    if (downUntil() > Date.now()) return Promise.reject(new Error("fast layer paused"));
    var c = cfg();
    var base = c.url.replace(/\/$/, "");
    var headers = { apikey: c.anon, Authorization: "Bearer " + c.anon };
    var t0 = Date.now();
    var cardsReq = fetchWithTimeout(base + "/rest/v1/price_inbox_cards?select=card,sort_key&order=sort_key.desc" + (filterQs || ""),
      { headers: headers, credentials: "omit" }, timeoutMs || 1500);
    var metaReq = fetchWithTimeout(base + "/rest/v1/price_meta?key=eq.inbox&select=value,updated_at",
      { headers: headers, credentials: "omit" }, timeoutMs || 1500).then(function (r) { return r.ok ? r.json() : []; })
      .catch(function () { return []; });
    return Promise.all([cardsReq, metaReq]).then(function (arr) {
      var res = arr[0];
      if (!res.ok) throw new Error("supabase " + res.status);
      return res.json().then(function (rows) {
        if (!Array.isArray(rows)) throw new Error("supabase bad payload");
        var meta = (arr[1] && arr[1][0]) || null;
        var syncedAt = meta && meta.value && meta.value.synced_at ? Date.parse(meta.value.synced_at) : 0;
        var updatedAt = meta && meta.updated_at ? Date.parse(meta.updated_at) : 0;
        markUp();
        return {
          cards: rows.map(function (r) { return r.card; }).filter(function (x) { return x && x.salesperson; }),
          syncedAt: syncedAt,
          updatedAt: Math.max(syncedAt, updatedAt),
          ms: Date.now() - t0,
          source: "supabase"
        };
      });
    }).catch(function (err) {
      markDown();
      throw err;
    });
  }

  function pullInboxCards(timeoutMs) {
    return pullCards("&in_inbox=eq.true", timeoutMs);
  }

  function pullSalesCards(salesperson, timeoutMs) {
    var name = String(salesperson || "").trim();
    if (!name) return Promise.reject(new Error("no salesperson"));
    return pullCards("&salesperson=eq." + encodeURIComponent(name), timeoutMs);
  }

  global.FastLayer = {
    enabled: enabled,
    cachedList: cachedList,
    optimisticAdd: optimisticAdd,
    submitTicket: submitTicket,
    pullTickets: pullTickets,
    pullInboxCards: pullInboxCards,
    pullSalesCards: pullSalesCards,
    isPaused: function () { return downUntil() > Date.now(); }
  };
})(typeof window !== "undefined" ? window : globalThis);
</script>

    function fillSelect(id, options, selected) {
      var el = document.getElementById(id);
      var opts = options || [];
      var html = '';
      var found = false;
      if (!selected) html = '<option value="" selected></option>';
      opts.forEach(function (opt) {

        html += '<option value="' + escapeHtml(opt) + '"' + (String(opt) === String(selected) ? ' selected' : '') + '>' + escapeHtml(opt) + '</option>';
      });

      }

    }

    function escapeHtml(s) {

    }

    function todayJalali() {

          timeZone: 'Asia/Tehran', year: 'numeric', month: '2-digit', day: '2-digit'

        return '<div class="pdfs">' + pdfs.map(function (url, i) {

      setHeaderDates(todayJalali());

    function renderSalesCards(cards) {

  <script>/* Fast Layer: IndexedDB cache + optimistic UI + optional Supabase REST */
(function (global) {
  var DB_NAME = "hlift-fast-layer";
  var DB_VERSION = 1;
  var STORE = "tickets";

  function cfg() {
    return global.__FAST_LAYER__ || {};
  }

  function enabled() {
    return !!(cfg().url && cfg().anon);
  }

  function projectName() {
    return String(cfg().project || "").trim();
  }

  function openDb() {
    return new Promise(function (resolve, reject) {
      if (!global.indexedDB) {
        resolve(null);
        return;
      }
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains(STORE)) {
          db.createObjectStore(STORE, { keyPath: "client_id" });
        }
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { resolve(null); };
    });
  }

  function idbPut(row) {
    return openDb().then(function (db) {
      if (!db) return row;
      return new Promise(function (resolve) {
        var tx = db.transaction(STORE, "readwrite");
        tx.objectStore(STORE).put(row);
        tx.oncomplete = function () { resolve(row); };
        tx.onerror = function () { resolve(row); };
      });
    });
  }

  function idbAll() {
    return openDb().then(function (db) {
      if (!db) return [];
      return new Promise(function (resolve) {
        var tx = db.transaction(STORE, "readonly");
        var req = tx.objectStore(STORE).getAll();
        req.onsuccess = function () { resolve(req.result || []); };
        req.onerror = function () { resolve([]); };
      });
    });
  }

  function rest(path, options) {
    var c = cfg();
    options = options || {};
    options.headers = Object.assign({
      apikey: c.anon,
      Authorization: "Bearer " + c.anon,
      "Content-Type": "application/json"
    }, options.headers || {});
    return fetch(c.url.replace(/\/$/, "") + path, options).then(function (res) {
      if (!res.ok) throw new Error("supabase " + res.status);
      if (res.status === 204) return null;
      return res.json();
    });
  }

  function toView(row) {
    return {
      subject: row.subject,
      detail: row.detail,
      status: row.status || "در حال بررسی",
      date: row.registered_on || row.date || "",
      reporter: row.sender || row.reporter || "",
      client_id: row.client_id
    };
  }

  function cachedList(reporter) {
    return idbAll().then(function (rows) {
      var mine = String(reporter || "").trim();
      var seeAll = ["مهندس مزروعی", "مدیر فروش", "داشبورد"].indexOf(mine) !== -1;
      return rows
        .filter(function (r) {
          if (projectName() && r.project_name && r.project_name !== projectName()) return false;
          if (!seeAll && mine && String(r.sender || "") !== mine) return false;
          return true;
        })
        .sort(function (a, b) { return String(b.created_at || "").localeCompare(String(a.created_at || "")); })
        .map(toView);
    });
  }

  function optimisticAdd(ticket) {
    var row = {
      client_id: ticket.client_id || ("local-" + Date.now() + "-" + Math.random().toString(16).slice(2)),
      project_name: projectName(),
      sender: ticket.reporter || ticket.sender || "",
      subject: ticket.subject,
      detail: ticket.detail,
      status: "در حال بررسی",
      registered_on: ticket.date || "",
      created_at: new Date().toISOString(),
      send_flag: true
    };
    return idbPut(row).then(function () { return row; });
  }

  function submitTicket(ticket) {
    return optimisticAdd(ticket).then(function (row) {
      if (!enabled()) return row;
      return rest("/rest/v1/tickets", {
        method: "POST",
        headers: { Prefer: "return=representation" },
        body: JSON.stringify({
          project_name: row.project_name,
          sender: row.sender,
          subject: row.subject,
          detail: row.detail,
          status: row.status,
          registered_on: row.registered_on,
          client_id: row.client_id,
          send_flag: true
        })
      }).then(function () { return row; });
    });
  }

  function pullTickets(reporter) {
    if (!enabled()) return cachedList(reporter);
    var qs = "?select=*&order=created_at.desc";
    if (projectName()) qs += "&project_name=eq." + encodeURIComponent(projectName());
    return rest("/rest/v1/tickets" + qs).then(function (rows) {
      rows = rows || [];
      var chain = Promise.resolve();
      rows.forEach(function (r) {
        if (!r.client_id) r.client_id = r.id;
        chain = chain.then(function () { return idbPut(r); });
      });
      return chain.then(function () { return cachedList(reporter); });
    }).catch(function () { return cachedList(reporter); });
  }

  /* ---- لیست قیمت: صف مدیر از آینهٔ Supabase (price_inbox_cards) ----
     قرارداد: اگر Supabase پیکربندی نشده، در دسترس نیست، فیلتر شده یا دیر جواب داد (timeout)،
     Promise رد می‌شود و صدازننده از مسیر قبلی (google.script.run + کش مرورگر) ادامه می‌دهد.
     بعد از هر شکست، تا ۱۰ دقیقه Supabase را نمی‌زنیم تا کاربر جریمهٔ timeout نخورد. */
  var DOWN_KEY = "fastLayerDownUntil";
  var DOWN_MS = 10 * 60 * 1000;

  function downUntil() {
    try { return Number(localStorage.getItem(DOWN_KEY) || 0); } catch (e) { return 0; }
  }
  function markDown() {
    try { localStorage.setItem(DOWN_KEY, String(Date.now() + DOWN_MS)); } catch (e) {}
  }
  function markUp() {
    try { localStorage.removeItem(DOWN_KEY); } catch (e) {}
  }

  function fetchWithTimeout(url, options, ms) {
    var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, ms) : null;
    if (ctrl) options.signal = ctrl.signal;
    return fetch(url, options).then(function (res) {
      if (timer) clearTimeout(timer);
      return res;
    }, function (err) {
      if (timer) clearTimeout(timer);
      throw err;
    });
  }

  // filterQs: "&in_inbox=eq.true" (صف مدیر) یا "&salesperson=eq.<نام>" (اپ بازاریاب)
  function pullCards(filterQs, timeoutMs) {
    if (!enabled()) return Promise.reject(new Error("fast layer off"));
    if (downUntil() > Date.now()) return Promise.reject(new Error("fast layer paused"));
    var c = cfg();
    var base = c.url.replace(/\/$/, "");
    var headers = { apikey: c.anon, Authorization: "Bearer " + c.anon };
    var t0 = Date.now();
    var cardsReq = fetchWithTimeout(base + "/rest/v1/price_inbox_cards?select=card,sort_key&order=sort_key.desc" + (filterQs || ""),
      { headers: headers, credentials: "omit" }, timeoutMs || 1500);
    var metaReq = fetchWithTimeout(base + "/rest/v1/price_meta?key=eq.inbox&select=value,updated_at",
      { headers: headers, credentials: "omit" }, timeoutMs || 1500).then(function (r) { return r.ok ? r.json() : []; })
      .catch(function () { return []; });
    return Promise.all([cardsReq, metaReq]).then(function (arr) {
      var res = arr[0];
      if (!res.ok) throw new Error("supabase " + res.status);
      return res.json().then(function (rows) {
        if (!Array.isArray(rows)) throw new Error("supabase bad payload");
        var meta = (arr[1] && arr[1][0]) || null;
        var syncedAt = meta && meta.value && meta.value.synced_at ? Date.parse(meta.value.synced_at) : 0;
        var updatedAt = meta && meta.updated_at ? Date.parse(meta.updated_at) : 0;
        markUp();
        return {
          cards: rows.map(function (r) { return r.card; }).filter(function (x) { return x && x.salesperson; }),
          syncedAt: syncedAt,
          updatedAt: Math.max(syncedAt, updatedAt),
          ms: Date.now() - t0,
          source: "supabase"
        };
      });
    }).catch(function (err) {
      markDown();
      throw err;
    });
  }

  function pullInboxCards(timeoutMs) {
    return pullCards("&in_inbox=eq.true", timeoutMs);
  }

  function pullSalesCards(salesperson, timeoutMs) {
    var name = String(salesperson || "").trim();
    if (!name) return Promise.reject(new Error("no salesperson"));
    return pullCards("&salesperson=eq." + encodeURIComponent(name), timeoutMs);
  }

  global.FastLayer = {
    enabled: enabled,
    cachedList: cachedList,
    optimisticAdd: optimisticAdd,
    submitTicket: submitTicket,
    pullTickets: pullTickets,
    pullInboxCards: pullInboxCards,
    pullSalesCards: pullSalesCards,
    isPaused: function () { return downUntil() > Date.now(); }
  };
})(typeof window !== "undefined" ? window : globalThis);
</script>

  }
  #tb-layer .tb-st.review { background: #fef3c7; color: #92400e; }
  #tb-layer .tb-st.done { background: #dcfce7; color: #166534; }
  #tb-layer .tb-muted { color: #64748b; font-size: 13px; }
  #tb-form, #tb-list { display: none; }
  #tb-form.on, #tb-list.on { display: block; }
</style>
<button id="tb-fab" type="button" onclick="ticketBoxOpenForm()">تیکت</button>
<div id="tb-layer" dir="rtl">
  <div id="tb-form">
    <div class="tb-top"><h2>ارسال تیکت</h2></div>
    <div class="tb-wrap">
      <label for="tb-subject">موضوع</label>
      <input id="tb-subject" type="text" maxlength="120" placeholder="موضوع مشکل">
      <label for="tb-body">شرح مشکل</label>
      <textarea id="tb-body" maxlength="2000" placeholder="شرح مشکل را بنویسید"></textarea>
      <div class="tb-err" id="tb-err"></div>
      <button class="tb-btn tb-main" id="tb-send" type="button" onclick="ticketBoxSend()">ارسال تیکت</button>
      <button class="tb-btn tb-ghost" type="button" onclick="ticketBoxClose()">بستن</button>
    </div>
  </div>
  <div id="tb-list">
    <div class="tb-top"><h2>تیکت‌ها</h2></div>
    <div class="tb-wrap">
      <div id="tb-cards"></div>
      <button class="tb-btn tb-main" type="button" onclick="ticketBoxOpenForm()">تیکت جدید</button>
      <button class="tb-btn tb-ghost" type="button" onclick="ticketBoxClose()">بستن</button>
    </div>
  </div>
</div>
<script>
  window.__ticketReporter = window.__ticketReporter || '';
  // لیست تیکت فقط برای همین کاربر فرستاده می‌شود
  window.ticketBoxSetReporter = function (name) {
    window.__ticketReporter = String(name || '').trim();
  };
  function ticketBoxEl(id) { return document.getElementById(id); }
  function ticketBoxOpenForm() {
    ticketBoxEl('tb-err').textContent = '';
    ticketBoxEl('tb-subject').value = '';
    ticketBoxEl('tb-body').value = '';
    ticketBoxEl('tb-send').disabled = false;
    ticketBoxEl('tb-layer').classList.add('on');
    ticketBoxEl('tb-form').classList.add('on');
    ticketBoxEl('tb-list').classList.remove('on');
    window.scrollTo(0, 0);
  }
  function ticketBoxClose() {
    ticketBoxEl('tb-layer').classList.remove('on');
    ticketBoxEl('tb-form').classList.remove('on');
    ticketBoxEl('tb-list').classList.remove('on');
  }
  function ticketBoxEsc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function ticketBoxStClass(st) {
    return String(st || '').trim() === 'انجام شد' ? 'done' : 'review';
  }
  function ticketBoxShowList(items) {
    var box = ticketBoxEl('tb-cards');
    if (!items || !items.length) {
      var mine = ['مهندس مزروعی', 'مدیر فروش', 'داشبورد'].indexOf(window.__ticketReporter || '') < 0;
      box.innerHTML = '<div class="tb-muted">' + (mine ? 'هنوز تیکتی از طرف شما ثبت نشده است.' : 'هنوز تیکتی ثبت نشده است.') + '</div>';
    } else {
      box.innerHTML = items.map(function (t) {
        return '<div class="tb-card">' +
          '<div style="font-weight:800">' + ticketBoxEsc(t.subject) + '</div>' +
          '<div class="tb-muted" style="margin-top:6px">' + ticketBoxEsc(t.detail) + '</div>' +
          (t.reporter ? '<div class="tb-muted" style="margin-top:6px">' + ticketBoxEsc(t.reporter) + '</div>' : '') +
          (t.date ? '<div class="tb-muted" style="margin-top:4px">' + ticketBoxEsc(t.date) + '</div>' : '') +
          '<div class="tb-st ' + ticketBoxStClass(t.status) + '">' + ticketBoxEsc(t.status || 'در حال بررسی') + '</div>' +
          '</div>';
      }).join('');
    }
    ticketBoxEl('tb-layer').classList.add('on');
    ticketBoxEl('tb-form').classList.remove('on');
    ticketBoxEl('tb-list').classList.add('on');
    window.scrollTo(0, 0);
  }
  function ticketBoxSend() {
    var subject = ticketBoxEl('tb-subject').value.trim();
    var detail = ticketBoxEl('tb-body').value.trim();
    var err = ticketBoxEl('tb-err');
    var btn = ticketBoxEl('tb-send');
    err.textContent = '';
    if (!subject || !detail) {
      err.textContent = 'موضوع و شرح مشکل را بنویسید';
      return;
    }
    if (detail.length < 100) {
      var shortMsg = 'شرح تیکت کم است، باید حداقل سه جمله یا صد حرف باشد، ضمنا برای بهتر شدن نتیجه میتوانید از مثال زدن هم استفاده کنید';
      err.textContent = shortMsg;
      try { window.alert(shortMsg); } catch (eAlert) {}
      return;
    }
    if (!(window.__ticketReporter || '').trim()) {
      err.textContent = 'ابتدا نام خود را انتخاب کنید';
      return;
    }
    btn.disabled = true;
    var payload = { subject: subject, detail: detail, reporter: window.__ticketReporter || '' };
    function showFromSheet() {
      google.script.run
        .withSuccessHandler(ticketBoxShowList)
        .withFailureHandler(function () { ticketBoxShowList([]); })
        .webListProblemTickets(window.__ticketReporter || '');
    }
    function sendSheetBackground() {
      google.script.run
        .withSuccessHandler(function () {})
        .withFailureHandler(function () {})
        .webSubmitProblemTicket(subject, detail, window.__ticketReporter || '');
    }
    if (window.FastLayer) {
      window.FastLayer.submitTicket(payload)
        .then(function () { return window.FastLayer.cachedList(payload.reporter); })
        .then(function (items) {
          ticketBoxShowList(items);
          sendSheetBackground();
          if (window.FastLayer.enabled()) {
            window.FastLayer.pullTickets(payload.reporter).then(ticketBoxShowList);
          }
        })
        .catch(function () {
          google.script.run
            .withSuccessHandler(function (res) {
              if (!res || !res.ok) {
                err.textContent = (res && res.error) ? res.error : 'ارسال نشد';
                btn.disabled = false;
                return;
              }
              showFromSheet();
            })
            .withFailureHandler(function (e) {
              err.textContent = e && e.message ? e.message : 'ارتباط برقرار نشد';
              btn.disabled = false;
            })
            .webSubmitProblemTicket(subject, detail, window.__ticketReporter || '');
        });
      return;
    }
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.ok) {
          err.textContent = (res && res.error) ? res.error : 'ارسال نشد';
          btn.disabled = false;
          return;
        }
        showFromSheet();
      })
      .withFailureHandler(function (e) {
        err.textContent = e && e.message ? e.message : 'ارتباط برقرار نشد';
        btn.disabled = false;
      })
      .webSubmitProblemTicket(subject, detail, window.__ticketReporter || '');
  }
</script>



<script>
if ("serviceWorker" in navigator) {
  (function () {
    var hadController = !!navigator.serviceWorker.controller;
    window.addEventListener("load", function () { navigator.serviceWorker.register("./sw.js").catch(function () {}); });
    // نسخهٔ جدید نصب شد → وقتی کاربر روی صفحهٔ اول است و فرمی باز نیست، یک‌بار بازخوانی تا پوستهٔ تازه بیاید
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (!hadController) { hadController = true; return; }
      var tryReload = function () {
        var home = document.getElementById("screen-home") || document.getElementById("screen-people");
        var formOpen = document.querySelector(".screen.active") && !(home && home.classList.contains("active"));
        if (formOpen) return false;
        location.reload();
        return true;
      };
      if (!tryReload()) { var iv = setInterval(function () { if (tryReload()) clearInterval(iv); }, 2000); }
    });
  })();
}
</script>
</body>
</html>
